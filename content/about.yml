title: About Me
description: Learn more about my journey as a Boston-based fullstack software engineer, my product mindset, and my approach to building scalable digital products.
content: |
  Hi, I'm **Alan Gama**, a fullstack software engineer based in Boston. For the past six years, I've focused on building digital products that are simple to understand, practical to use, and polished in every detail.

  My path started with an **Interactive Design** degree at Boston University, where I learned to connect user needs with technical execution. Since then, I've focused on building end-to-end solutions, from frontend interfaces to backend services and data layers.

  ### My Product Philosophy

  My product philosophy is rooted in **empathy** and **problem-solving**. Good software starts with understanding user needs, translating them into clear technical decisions, and validating outcomes quickly.

  I build interfaces and systems that feel effortless, where product clarity and technical quality support each other. Whether I'm shaping the frontend or building backend services, the goal is always the same: deliver reliable value to end users.

  ### What Drives Me

  What keeps me excited about this work is the constant learning and the challenge of turning complex requirements into simple, scalable systems. Seeing software become something people actually rely on is the most rewarding part.

  ### Beyond the Screen

  When I'm not coding, you might find me exploring Boston's coffee shops, hiking nearby trails, taking photos, or contributing to open-source projects.

  Thanks for stopping by. Feel free to browse my [projects](/projects) or [get in touch](/#contact) if you'd like to collaborate!
