faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my process and services.
  categories:
    - title: Services & Process
      questions:
        - label: What services do you offer?
          content: |
            I specialize in fullstack software engineering with a strong product focus. That includes frontend architecture, Vue.js and Nuxt.js applications, Flutter mobile apps, backend APIs, database design, integrations, and design system implementation. I also work with Laravel, NestJS, Node.js, MySQL, Docker, AWS Lambda, Azure AI, and REST APIs to build scalable, maintainable products.
        - label: What is your design process like?
          content: |
            My process is collaborative and iterative, usually moving through discovery, technical planning, implementation, and validation. I adapt it to each project while balancing product impact, delivery speed, and code quality.
        - label: Can you handle a express demand?
          content: |
            Yes, I do. I have a streamlined process specifically for short-term demands and 2-week projects.
    - title: Pricing & Timelines
      questions:
        - label: How much does a project typically cost?
          content: |
            Project costs are calculated based on the estimated hours required for the scope and complexity. Typically, my fullstack projects start at $4,000 for a 2-week sprint. For consulting or specific tasks, my rate is $50 per hour. Once we define the requirements, I’ll provide a precise breakdown of the billable hours.
        - label: What are your payment terms?
          content: |
            I accept bank transfers (including local transfers in Brazil), Bitcoin, PayPal, and Stripe. For ongoing projects, payments are typically processed on a monthly basis.
        - label: How long does a typical project take?
          content: |
            Timelines depend heavily on the project's scope and complexity. Smaller projects might take 3-4 weeks, while larger, more involved projects can range from 2 to 4 months. I always provide a detailed timeline estimate after the initial discovery phase.
        - label: Do you offer retainers or ongoing support?
          content: |
            Yes. I offer monthly retainers for ongoing development and support. As long as the work is limited to bug fixes or minor adjustments, there are no additional charges outside the monthly fee. For new features or major changes, we would simply adjust the scope accordingly.
    - title: About Me
      questions:
        - label: What do you enjoy most about your work?
          content: |
            I love solving complex product problems through software engineering. It is rewarding to ship systems people rely on and know they are fast, stable, and genuinely useful.
        - label: What are your hobbies outside of work?
          content: |
            When I’m not coding or architecting systems, I’m usually playing guitar and exploring digital signal processing (DSP) to craft unique tones. I’m also a fitness enthusiast, enjoying the discipline of weightlifting and outdoor activities. These hobbies keep my mind sharp and my creativity flowing for my technical work.
