faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my process and services.
  categories:
    - title: Services & Process
      questions:
        - label: What services do you offer?
          content: |
            I specialize in fullstack software engineering with a strong product focus. That includes frontend architecture, Vue.js/Nuxt.js applications, backend APIs, database design, integrations, and design system implementation.
        - label: What is your design process like?
          content: |
            My process is collaborative and iterative, usually moving through discovery, technical planning, implementation, and validation. I adapt it to each project while balancing product impact, delivery speed, and code quality.
        - label: Do you work with startups?
          content: |
            Absolutely! I enjoy working with startups to help shape their product vision and create user-friendly interfaces from the ground up. I can adapt my process to fit the fast-paced startup environment.
    - title: Pricing & Timelines
      questions:
        - label: How much does a project typically cost?
          content: |
            Project costs vary based on scope, complexity, features, and timeline. For fullstack software work, projects typically start around $5,000, with larger engagements ranging between $8,000 and $25,000. For consulting or specific design tasks, my day rate is $700.
        - label: What are your payment terms?
          content: |
            I generally require a 40% deposit to schedule the project and begin work, with the remaining 60% due upon successful project completion and delivery. I accept payments via bank transfer and Stripe.
        - label: How long does a typical project take?
          content: |
            Timelines depend heavily on the project's scope and complexity. Smaller projects might take 3-4 weeks, while larger, more involved projects can range from 2 to 4 months. I always provide a detailed timeline estimate after the initial discovery phase.
        - label: Do you offer retainers or ongoing support?
          content: |
            Yes. For teams needing ongoing feature development, technical support, or maintenance, I offer monthly retainer options tailored to specific needs.
    - title: About Me
      questions:
        - label: What do you enjoy most about your work?
          content: |
            I love solving complex product problems through software engineering. It is rewarding to ship systems people rely on and know they are fast, stable, and genuinely useful.
        - label: What are your hobbies outside of work?
          content: |
            When I'm not designing or coding, I enjoy exploring Boston's neighborhoods, trying new coffee shops, hiking nearby trails, and taking photos. I also like contributing to open-source projects when time allows.
